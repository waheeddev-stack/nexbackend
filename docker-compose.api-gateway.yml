name: traefik

services:
  traefik:
    image: traefik:v3.7.13
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - '--api=true'
      - '--api.dashboard=true'
      - '--log.level=INFO'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--certificatesresolvers.cert-resolver.acme.httpchallenge=true'
      - '--certificatesresolvers.cert-resolver.acme.httpchallenge.entrypoint=web'
      - '--certificatesresolvers.cert-resolver.acme.email=nexkiranaofficial@gmail.com'
      - '--certificatesresolvers.cert-resolver.acme.storage=/letsencrypt/acme.json'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.http.tls=true'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './certificates/letsencrypt:/letsencrypt'
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    networks:
      - traefik
      - project-a-network
      - traefik-dozzle

networks:
  traefik:
    name: traefik
  project-a-network:
    name: project-a-network
  traefik-dozzle:
    name: traefik-dozzle
