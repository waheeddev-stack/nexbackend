name: server-application-a

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - internal
    # replicas via compose (swarm uses deploy.replicas, compose uses scale)
    # Use: docker compose -f docker-compose.server.yml up -d --scale api-service=5
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api-service
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.my-router.rule=Host(`api.zeu.co.in`)'
      - 'traefik.http.services.my-router.loadbalancer.server.port=80'
      - 'traefik.http.routers.my-router.entrypoints=websecure'
      - 'traefik.docker.network=project-a-network'
      - 'traefik.http.routers.my-router.tls=true'
      - 'traefik.http.routers.my-router.tls.certresolver=cert-resolver'
    networks:
      - project-a-network
      - internal

networks:
  internal:
    driver: bridge
  project-a-network:
    external: true
