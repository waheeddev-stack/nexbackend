name: logs-stack

services:
  dozzle:
    image: amir20/dozzle:latest
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Optional: uncomment to protect logs.zeu.co.in (highly recommended)
      # - DOZZLE_LEVEL=info
      # - DOZZLE_AUTH_PROVIDER=simple
      # Generate hash: docker run --rm amir20/dozzle generate --password yourpassword
      # - DOZZLE_USERNAME=admin
      # - DOZZLE_PASSWORD_HASH=
      - DOZZLE_ADDR=0.0.0.0:8080
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dozzle
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.logs-svc.rule=Host(`logs.zeu.co.in`)'
      - 'traefik.http.services.logs-svc.loadbalancer.server.port=80'
      - 'traefik.http.routers.logs-svc.entrypoints=websecure'
      - 'traefik.docker.network=traefik-dozzle'
      - 'traefik.http.routers.logs-svc.tls=true'
      - 'traefik.http.routers.logs-svc.tls.certresolver=cert-resolver'
    networks:
      - internal
      - traefik-dozzle

networks:
  internal:
    driver: bridge
  traefik-dozzle:
    external: true
